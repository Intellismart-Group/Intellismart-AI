name: Finish blog separation

on:
  push:
    branches:
      - peter/separate-blog-page
    paths:
      - .github/workflows/finish-blog-separation.yml

permissions:
  contents: write

jobs:
  update-landing-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: peter/separate-blog-page
          fetch-depth: 0

      - name: Move blog off landing page
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('cloudways-live/index.html')
          html = path.read_text(encoding='utf-8')

          html = html.replace('href="#blog" onclick="closeNav()">Blog</a>', 'href="blog.html" onclick="closeNav()">Blog</a>')
          html = html.replace('href="#blog">Blog</a>', 'href="blog.html">Blog</a>')

          css_start = html.find('    /* ═══ BLOG ═══ */')
          css_end = html.find('    /* ═══ CASE STUDY ═══ */', css_start)
          if css_start != -1 and css_end != -1:
              html = html[:css_start] + html[css_end:]

          section_start = html.find('  <!-- BLOG -->')
          footer_start = html.find('  <footer class="footer">', section_start)
          if section_start != -1 and footer_start != -1:
              html = html[:section_start] + html[footer_start:]

          path.write_text(html, encoding='utf-8')

          assert '#blog' not in html, 'Landing page still contains #blog links'
          assert 'app.trysoro.com/api/embed' not in html, 'Soro widget still embedded on landing page'
          assert html.count('href="blog.html"') >= 2, 'Blog links were not updated'
          PY

      - name: Commit landing-page changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudways-live/index.html
          git commit -m "Link landing page to dedicated blog" || exit 0
          git push origin peter/separate-blog-page
